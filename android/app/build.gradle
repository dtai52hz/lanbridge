plugins { id 'com.android.application' }

android {
    namespace 'io.github.dtai52hz.lanbridge'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.dtai52hz.lanbridge'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.0-preview.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.register('exportInteropClasspath') {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    doLast {
        def runtime = files(tasks.named('compileDebugJavaWithJavac').get().destinationDirectory,
                tasks.named('compileDebugUnitTestJavaWithJavac').get().destinationDirectory,
                configurations.debugUnitTestRuntimeClasspath)
        file("$buildDir/interop-classpath.txt").text = runtime.asPath
    }
}
