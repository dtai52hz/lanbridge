name: Desktop platforms
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crossplatform/**'
      - 'tests/CrossPlatformSmoke/**'
      - 'tests/TransportSmoke/**'
      - 'tests/FileSmoke/**'
      - 'tests/TextInputSmoke/**'
      - 'src/Models.cs'
      - 'src/Transport.cs'
      - 'src/Discovery.cs'
      - 'src/FileTransfer.cs'
      - 'src/VietnameseInput.cs'
      - 'src/SwitchShortcut.cs'
      - 'scripts/build-desktop.ps1'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxi6 libxtst6 libxt6t64 libxkbcommon0 libxinerama1 libxrandr2 libice6 libsm6 libfontconfig1 xvfb xauth
      - name: Build and native-free tests
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Task Test
      - name: Isolated X11 native input smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unset WAYLAND_DISPLAY
          export XDG_SESSION_TYPE=x11
          export LANBRIDGE_ISOLATED_NATIVE_TEST=1
          xvfb-run --server-num=99 --server-args='-screen 0 1280x720x24' dotnet run --project crossplatform/LanBridge.Linux.NativeSmoke/LanBridge.Linux.NativeSmoke.csproj -c Release
      - name: Publish self-contained application
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Task Publish -Runtime '${{ matrix.rid }}'
      - name: Published application smoke
        shell: pwsh
        run: |
          $package = 'release/LanBridge-Desktop-0.8.0-preview.1-${{ matrix.rid }}'
          $executable = if ($IsWindows) { "$package/LanBridge.Desktop.exe" } else { "$package/LanBridge.Desktop" }
          & $executable --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Published application failed smoke.' }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: release/desktop-artifacts/*
          if-no-files-found: error
